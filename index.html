<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A beginner demonstration project for Git and GitHub collaboration.">
  <title>AI Web Development</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #202638;
      background: #f4f6fb;
    }
    main {
      width: min(100%, 760px);
      padding: 40px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(27, 42, 68, 0.08);
    }
    h1 { color: #2457c5; }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to AI Web Development</h1>
    <p>This project demonstrates Git collaboration using branches, commits, pull requests, and code review.</p>
  </main>
</body>
</html>
